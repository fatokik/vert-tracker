[project]
name = "vert-tracker"
version = "0.1.0"
description = "Measure vertical jump height using a DJI Tello EDU drone and computer vision"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Your Name", email = "you@example.com" }]
dependencies = [
    "djitellopy>=2.5.0,<3",
    "mediapipe>=0.10.9,<0.11",
    "opencv-python>=4.9.0,<5",
    "numpy>=1.26.0,<2",
    "scipy>=1.12.0,<2",
    "pydantic-settings>=2.1.0,<3",
]

[project.scripts]
vert-tracker = "vert_tracker.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0,<9",
    "pytest-cov>=4.1.0,<5",
    "ruff>=0.2.0,<0.3",
    "mypy>=1.8.0,<2",
    "pre-commit>=3.6.0,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vert_tracker"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["vert_tracker"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
explicit_package_bases = true
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
show_error_codes = true
files = ["src"]

[[tool.mypy.overrides]]
module = [
    "djitellopy.*",
    "mediapipe.*",
    "cv2.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-v",
    "--cov=vert_tracker",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
]
